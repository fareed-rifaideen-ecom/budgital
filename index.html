    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('budgetly-settings-v1') || '{}');
          var theme = stored.theme === 'dark' || stored.theme === 'light' ? stored.theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0d1714' : '#f5f6f1');
        } catch (error) {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', prefersDark ? '#0d1714' : '#f5f6f1');
        }
      })();
    </script>
