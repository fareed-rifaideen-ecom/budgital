    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('budgetly-settings-v1') || '{}');
          var theme = stored.theme === 'dark' || stored.theme === 'light' ? stored.theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0d1714' : '#f5f6f1');
        } catch (error) {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', prefersDark ? '#0d1714' : '#f5f6f1');
        }
      })();
    </script>

      .route-shell-mark { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 12px; border-radius: 14px 14px 14px 4px; background: #16352c; color: #c8ee68; font-size: 22px; font-weight: 900; }
      .route-shell-kicker { margin: 0; color: #557067; font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }

      .route-shell p:last-child { margin: 4px 0 0; color: #667870; font-size: 14px; }

      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html[data-theme="dark"] { background: #0d1714; } html:not([data-theme="light"]) .route-shell, html[data-theme="dark"] .route-shell { background: #0d1714; color: #eff7ee; } html:not([data-theme="light"]) .route-shell-mark, html[data-theme="dark"] .route-shell-mark { background: #c8ee68; color: #12251d; } html:not([data-theme="light"]) .route-shell-kicker, html[data-theme="dark"] .route-shell-kicker { color: #b6c9bd; } html:not([data-theme="light"]) .route-shell p:last-child, html[data-theme="dark"] .route-shell p:last-child { color: #9aaea5; } }

    <script>
      (function () {
        if (!/^\/app(?:\/|$)/.test(window.location.pathname)) return;
        var shell = document.querySelector('.route-shell');
        var heading = shell && shell.querySelector('h1');
        var message = shell && shell.querySelector('p:last-child');
        if (shell) shell.classList.add('route-shell-app');
        if (heading) heading.textContent = 'Your money, in plain English.';
        if (message) message.textContent = 'Opening your private browser workspace…';
      })();
