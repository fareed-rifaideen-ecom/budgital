    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('budgetly-settings-v1') || '{}');
          var theme = stored.theme === 'dark' || stored.theme === 'light' ? stored.theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0d1714' : '#f5f6f1');
        } catch (error) {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', prefersDark ? '#0d1714' : '#f5f6f1');
        }
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d1714; }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 9px; position: relative; overflow: hidden; background: #0d1714; color: #f4f7f1; font: 500 16px/1.35 Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; }
      .boot-screen strong { font-size: 30px; letter-spacing: -.055em; }
      .boot-screen span { color: #9aaea5; font-size: 13px; }
      .boot-screen small { position: absolute; bottom: 28px; color: #91a39b; font-size: 11px; }
      .boot-tile { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 21px; background: linear-gradient(135deg,#c8ee68,#a9df3d); color: #12251d; font-size: 36px; font-weight: 800; box-shadow: 0 18px 45px rgba(200,238,104,.2); animation: boot-pulse 1.7s ease-in-out infinite; }
      .boot-screen i { width: 110px; height: 3px; border-radius: 99px; background: linear-gradient(90deg,transparent,#c8ee68,transparent); animation: boot-load 1.2s ease-in-out infinite; }
      .boot-orbit { position: absolute; border: 1px solid rgba(200,238,104,.22); border-radius: 50%; pointer-events: none; animation: boot-spin 7s linear infinite; }
      .boot-orbit-one { width: 260px; height: 260px; }.boot-orbit-two { width: 430px; height: 430px; border-style: dashed; animation-direction: reverse; }
      @keyframes boot-pulse { 50% { transform: translateY(-4px) scale(1.04); } }
      @keyframes boot-load { 50% { opacity: .45; transform: scaleX(.55); } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) { html[data-theme="light"] body, html[data-theme="light"] .boot-screen { background: #f5f6f1; color: #12251d; } html[data-theme="light"] .boot-screen span, html[data-theme="light"] .boot-screen small { color: #667870; } }
      @media (prefers-reduced-motion: reduce) { .boot-screen *, .boot-screen::before { animation: none !important; } }
    </style>
